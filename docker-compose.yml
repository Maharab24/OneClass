services:
  postgres:
    image: postgres:16-alpine
    container_name: oneclass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oneclass_db
      POSTGRES_USER: oneclass_user
      POSTGRES_PASSWORD: oneclass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneclass_user -d oneclass_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - oneclass-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oneclass_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/oneclass_db
      - DB_USERNAME=oneclass_user
      - DB_PASSWORD=oneclass123
      - DB_DRIVER=org.postgresql.Driver
      - SERVER_PORT=8080
    ports:
      - "8080:8080"
    networks:
      - oneclass-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oneclass_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - oneclass-network

volumes:
  postgres_data:

networks:
  oneclass-network:
    driver: bridge
