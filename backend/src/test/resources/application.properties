spring.application.name=oneclass-backend-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=TestSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHmacSha256Algorithm12345
app.jwt.expiration-ms=86400000
app.otp.expiration-minutes=10

# Mock mail settings so JavaMailSender works in test context
spring.mail.host=localhost
spring.mail.port=25
