server:
  port: 8080

spring:
  application:
    name: oneclass-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oneclass_db}
    username: ${DB_USERNAME:oneclass_user}
    password: ${DB_PASSWORD:oneclass_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:ReplaceThisWithALongRandomBase64SecretKeyForJwtSigning123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
